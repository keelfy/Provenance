# Names this server. With HuskSync, items a player carries over from another server keep their origin and the history
# says which server they came from; leave empty to switch that off. It must be different on every server, also when they
# share one database (storage below): rows of two servers with the same id would be mixed up.
server:
  id: ""

journal:
  # Journal back-to-back hopper moves of one item between the same two blocks as a single event.
  # Cuts the size of the history; the only cost is that /prov history shows one line instead of many.
  merge-automation: true
  # Events of one kind that happened in the same chunk and the same bucket of this many minutes are stored as one with
  # the total amount: 100k mined cobblestones or killed zombies become a few lines per hour and chunk instead of
  # hundreds of thousands. The history shows the span from the first to the last. Buckets are merged once they have
  # ended; items still lying on the ground are folded away on the way.
  bucket-minutes: 60
  # Days to keep events that involve a player or create items.
  retention-days: 30
  # Days to keep pure automation (block to block); it dominates volume and matters little for moderation.
  automation-retention-days: 3

storage:
  # Where the data is kept: sqlite (a file in the plugin folder, nothing else to set up), mysql (MySQL or MariaDB) or
  # postgresql. Switching does not move existing data.
  type: sqlite
  # mysql and postgresql only. The database must exist and the user must be able to create tables in it.
  host: localhost
  # 0 means the default port of the type: 3306 for mysql, 5432 for postgresql.
  port: 0
  database: provenance
  username: ""
  password: ""
  # How often changed holders are snapshotted and handed to the writer thread.
  flush-interval-seconds: 30
  # How often journal entries past their retention are dropped.
  prune-interval-hours: 24
  # How long shutdown waits for queued writes.
  shutdown-timeout-seconds: 30

# Safety net for item changes no listener models (placing, eating, tool breaks, other plugins).
reconcile-interval-seconds: 5

# How far, in blocks, from an event an item entity still counts as coming from it.
attribution:
  block-radius: 2.0
  dispense-radius: 1.0
  eject-radius: 1.0
  death-radius: 3.0
  spill-radius: 1.5

commands:
  # How far, in blocks, /prov looks for a container.
  block-reach: 6
  history-rows: 20
  block-rows: 10
  player-rows: 10
  link-rows: 10
  # Origins listed in a "share" line.
  top-origins: 6

# Web viewer: /prov web ... posts a snapshot of the events to your Provenance web server and prints a one-time link.
web:
  # Base URL of the web server, e.g. https://prov.example.com. Empty switches /prov web off.
  endpoint: ""
  # Shared secret that signs requests; must equal PROVENANCE_SECRET on the web server.
  secret: ""
  # How long a link stays valid.
  ttl-hours: 24
  # How many holders away from the starting point events are followed.
  depth: 2
  # Most events in one snapshot; the newest are kept.
  max-events: 2000
